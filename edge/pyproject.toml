[project]
name = "observatory-edge"
version = "0.1.0"
description = "Wildlife Observatory edge service (ingest, jobs, tracking, alerts, API)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pillow>=10",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pyftpdlib>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
observatory = "observatory_edge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory_edge"]
artifacts = ["src/observatory_edge/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
