[project]
name = "observatory-worker"
version = "0.1.0"
description = "Wildlife Observatory inference worker (MegaDetector + SpeciesNet)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "speciesnet==5.0.6",
  "httpx>=0.27",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
observatory-worker = "observatory_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
